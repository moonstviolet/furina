<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>圣遗物评分计算器</title>
    <style>
        :root {
            --bg-color: rgb(165, 151, 182);
            --primary-bg: rgb(69, 51, 112);
            --input-bg: rgb(33, 26, 62);
            --accent-color: rgb(208, 108, 157);
            --text-color: rgb(254, 243, 232);
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            margin: 0 auto; /* 左右 */
            padding: 20px;
        }

        .header {
            width: 100%;
            text-align: center;
            border-bottom: 2px solid;
        }
        .header h2 {
            text-align: right;
        }

        .calculator-container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            padding: 20px;
        }

        .weight-card {
            background: var(--primary-bg);
            border: 1px solid;
            border-radius: 12px;
            padding: 20px;
            min-width: 300px;
        }

        .weight-card-title {
            text-align: center;
            border-bottom: 2px solid;
            font-size: 1.8rem;
        }

        .weight-card-item {
            display: flex;
            flex-direction: column;
            font-size: 1.6rem;
            margin-top: 10px;
        }

        .weight-form-label {
            display: flex;
        }

        .weight-label-text {
            flex: 0 0 40%;
            text-align: right;
            margin-right: 20px;
        }

        .weight-number-input {
            width: 100%;
            background: var(--input-bg);
            color: var(--text-color);
            border: 1px solid;
            border-radius: 6px;
            font-size: 1.6rem;
        }

        .artifact-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .artifact-card {
            background: var(--primary-bg);
            border: 1px solid;
            border-radius: 12px;
            padding: 20px;
            min-width: 300px;
        }

        .artifact-card-title {
            text-align: center;
            border-bottom: 2px solid;
            font-size: 1.8rem;
        }

        .artifact-card-item {
            display: flex;
            flex-direction: row;
            gap: 20px;
            margin-top: 10px;
            font-size: 1.6rem;
        }

        .artifact-item-select {
            background: var(--input-bg);
            color: var(--text-color);
            border: 1px solid;
            border-radius: 6px;
            font-size: 1.6rem;
        }

        .artifact-number-input {
            width: 100%;
            background: var(--input-bg);
            color: var(--text-color);
            border: 1px solid;
            border-radius: 6px;
            font-size: 1.6rem;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        .btn-calculate {
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 1.6rem;
        }

        .artifact-score {
            font-size: 1.6rem;
        }

        @media (max-width: 1200px) {
            .calculator-container {
                grid-template-columns: 1fr;
            }

            .artifact-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
<div class="container">
    <div class="header">
        <h1>圣遗物评分计算器</h1>
        <h2>V1.0</h2>
    </div>
    <div class="calculator-container">
        <div v-scope="PropWeight()" class="weight-card"></div>
        <div class="artifact-container">
            <div v-scope="Artifact()" class="artifact-card"></div>
            <div v-scope="Artifact()" class="artifact-card"></div>
        </div>
    </div>
    <div class="footer">

    </div>
</div>
<template id="prop-weight-template">
    <h2 class="weight-card-title">属性权重</h2>
    <div class="weight-card-item" v-for="(value, key) in store.propWeight">
        <label class="weight-form-label">
            <span class="weight-label-text">{{ key }}</span>
            <input class="weight-number-input" type="number" v-model="store.propWeight[key]"
                   placeholder="0-100" @input="onPropWeightInput(key)">
        </label>
    </div>
</template>
<template id="artifact-template">
    <h2 class="artifact-card-title">圣遗物评分</h2>
    <div>
        <div class="artifact-card-item">
            <select class="artifact-item-select" v-model="selectedArtifactType" @change="onArtifactTypeChange">
                <option value="" disabled selected>圣遗物部位</option>
                <option v-for="type in artifactTypeList" :value="type">{{ type }}</option>
            </select>
            <select class="artifact-item-select" v-model="selectedMainProp" @change="onMainPropChange"
                    style="width: 100%;">
                <option v-if="mainPropList.length === 0" disabled value="">圣遗物主词条</option>
                <option v-for="prop in mainPropList" :value="prop">{{ prop }}</option>
            </select>
        </div>
    </div>
    <div v-if="showAppendProp">
        <div v-for="(prop, index) in appendProp" :key="index">
            <div class="artifact-card-item">
                <select class="artifact-item-select" v-model="prop.key">
                    <option value="" disabled selected>选择副词条</option>
                    <option v-for="key in appendPropList" :value="key">{{ key }}</option>
                </select>
                <input class="artifact-number-input" type="number" v-model="prop.value">
                <span v-if="showArtifactScore && prop.weight>=75" style="color: var(--accent-color)">+{{ prop.count.toFixed(1) }}</span>
                <span v-else-if="showArtifactScore">+{{ prop.count.toFixed(1) }}</span>
            </div>
        </div>
    </div>

    <div class="btn-container" v-if="showAppendProp">
        <button class="btn-calculate" @click="calculateScore">计算评分</button>
    </div>
    <div class="btn-container" v-if="showArtifactScore">
        <div class="artifact-score">
            {{ artifactScore.toFixed(1) }} {{ artifactRating }}
        </div>
    </div>
</template>
<script type="module">
    import {createApp, reactive, nextTick} from 'https://unpkg.com/petite-vue?module'

    const store = reactive({
        propWeight: {
            "生命值": 0,
            "攻击力": 75,
            "防御力": 0,
            "元素精通": 50,
            "暴击率": 100,
            "暴击伤害": 100,
            "充能效率": 0,
            "伤害加成": 100,
            "治疗加成": 0,
        }
    });

    const PropWeight = () => ({
        $template: "#prop-weight-template",
        onPropWeightInput(key) {
            let weight = Number(store.propWeight[key]);
            if (isNaN(weight) || weight < 0) {
                weight = 0;
            } else if (weight > 100) {
                weight = 100;
            }
            store.propWeight[key] = weight;
        },
    });

    const Artifact = () => ({
        artifactTypeList: ["生之花", "死之羽", "时之沙", "空之杯", "理之冠"],
        mainPropListByType: {
            "生之花": ["小生命"],
            "死之羽": ["小攻击"],
            "时之沙": [
                "大生命",
                "大攻击",
                "大防御",
                "元素精通",
                "充能效率"
            ],
            "空之杯": [
                "大生命",
                "大攻击",
                "大防御",
                "元素精通",
                "伤害加成",
            ],
            "理之冠": [
                "大生命",
                "大攻击",
                "大防御",
                "元素精通",
                "暴击率",
                "暴击伤害",
                "治疗加成"
            ],
        },
        allAppendProp: ["小生命", "小攻击", "小防御", "大生命", "大攻击", "大防御", "元素精通", "充能效率", "暴击率", "暴击伤害"],
        pctProp: ["大生命", "大攻击", "大防御", "充能效率", "暴击率", "暴击伤害"],
        propGrowth: {
            "小生命": [209.13, 239, 268.88, 298.75],
            "大生命": [0.048, 0.0466, 0.0525, 0.0583],
            "小攻击": [13.62, 15.56, 17.51, 19.45],
            "大攻击": [0.048, 0.0466, 0.0525, 0.0583],
            "小防御": [16.2, 18.52, 20.83, 23.15],
            "大防御": [0.051, 0.0583, 0.0656, 0.0729],
            "元素精通": [16.32, 18.65, 20.98, 23.31],
            "暴击率": [0.027, 0.031, 0.035, 0.0389],
            "暴击伤害": [0.0544, 0.0622, 0.0699, 0.0777],
            "充能效率": [0.0453, 0.0518, 0.0583, 0.0648],

            "治疗效率": [0, 0, 0, 0.0449],
            "伤害加成": [0, 0, 0, 0.0583],
            "物伤加成": [0, 0, 0, 0.0729],
        },
        selectedArtifactType: "", // 选择的圣遗物部位
        mainPropList: [], // 选择部位的圣遗物主词条
        selectedMainProp: "", // 选择的圣遗物主词条
        appendPropList: [], // 可能的副词条列表
        showAppendProp: false, // 显示副词条
        appendProp: [
            {key: "", value: 0, weight: 0, count: 0, score: 0},
            {key: "", value: 0, weight: 0, count: 0, score: 0},
            {key: "", value: 0, weight: 0, count: 0, score: 0},
            {key: "", value: 0, weight: 0, count: 0, score: 0}
        ], // 选择的副词条
        artifactScore: 0, // 圣遗物评分
        artifactRating: "", // 圣遗物评级
        showArtifactScore: false, // 显示圣遗物评分

        onArtifactTypeChange() {
            this.mainPropList = this.mainPropListByType[this.selectedArtifactType]
            nextTick(() => {
                if (this.mainPropList.length > 0) {
                    this.selectedMainProp = this.mainPropList[0]
                } else {
                    this.selectedMainProp = ""
                }
                this.onMainPropChange()
            })
        },
        onMainPropChange() {
            this.appendPropList = this.getAppendPropList()
            this.showAppendProp = true
            this.showArtifactScore = false
            // 清空
            this.appendProp = [
                {key: "", value: 0, weight: 0, count: 0, score: 0},
                {key: "", value: 0, weight: 0, count: 0, score: 0},
                {key: "", value: 0, weight: 0, count: 0, score: 0},
                {key: "", value: 0, weight: 0, count: 0, score: 0}
            ]
        },
        getAppendPropList() {
            return this.allAppendProp.filter(prop => prop !== this.selectedMainProp)
        },

        getPropWeight(key) {
            let weight = 0
            if (key === "小生命") {
                weight = store.propWeight["生命值"] / 3
            } else if (key === "大生命") {
                weight = store.propWeight["生命值"]
            } else if (key === "小攻击") {
                weight = store.propWeight["攻击力"] / 3
            } else if (key === "大攻击") {
                weight = store.propWeight["攻击力"]
            } else if (key === "小防御") {
                weight = store.propWeight["防御力"] / 3
            } else if (key === "大防御") {
                weight = store.propWeight["防御力"]
            } else {
                weight = store.propWeight[key]
            }
            return weight
        },

        getPropCount(key, value) {
            let base = this.propGrowth[key][3]
            return value / base
        },

        getBestMainPropWeight() {
            let weight = 0
            for (let i = 0; i < this.mainPropList.length; i++) {
                weight = Math.max(weight, this.getPropWeight(this.mainPropList[i]))
            }
            return weight
        },

        getArtifactRating(score) {
            const artifactRatingStr = ["D", "C", "B", "A", "S", "SS", "SSS", "ACE", "ACE²"]
            let r = Math.floor(score / 7)
            r = Math.min(r, 8)
            r = Math.max(r, 0)
            return artifactRatingStr[r]
        },

        calculateScore() {
            // 清空状态
            this.showArtifactScore = false
            this.artifactScore = 0

            const artifactPerNumberScore = 46.62 / 6
            const artifactMaxScore = 66.0
            // 副词条评分
            for (let i = 0; i < this.appendProp.length; i++) {
                if (this.appendProp[i].key === "") {
                    continue
                }
                if (this.pctProp.includes(this.appendProp[i].key)) {
                    // 百分比数据
                    this.appendProp[i].count = this.getPropCount(this.appendProp[i].key, this.appendProp[i].value / 100)
                } else {
                    this.appendProp[i].count = this.getPropCount(this.appendProp[i].key, this.appendProp[i].value)
                }

                this.appendProp[i].weight = this.getPropWeight(this.appendProp[i].key)

                this.appendProp[i].score = artifactPerNumberScore * this.appendProp[i].count * (this.appendProp[i].weight / 100)

                this.artifactScore += this.appendProp[i].score

            }

            let maxScore = 0
            // 理论最优副词条
            let weightList = [];
            for (let i = 0; i < this.appendPropList.length; i++) {
                weightList.push(this.getPropWeight(this.appendPropList[i]))
            }
            weightList.sort((a, b) => b - a)
            for (let i = 0; i < 4 && i < weightList.length; i++) {
                if (i === 0) {
                    maxScore += artifactPerNumberScore * 6 * weightList[i] / 100
                } else {
                    maxScore += artifactPerNumberScore * weightList[i] / 100
                }
            }

            // 主词条附加分0.25
            if (this.selectedArtifactType !== "生之花" && this.selectedArtifactType !== "死之羽") {
                let add = artifactPerNumberScore * 8 * this.getPropWeight(this.selectedMainProp) / 100 * 0.25
                this.artifactScore += add
                maxScore += add
            }

            // 归一化
            if (maxScore !== 0) {
                this.artifactScore = this.artifactScore / maxScore * artifactMaxScore
            }

            // 非最优主词条罚分
            if (this.selectedArtifactType !== "生之花" && this.selectedArtifactType !== "死之羽" && this.selectedMainProp !== "充能效率") {
                let dif = this.getBestMainPropWeight() - this.getPropWeight(this.selectedMainProp)
                if (dif > 50) {
                    dif = 50
                }
                if (dif > 0) {
                    this.artifactScore = this.artifactScore * (1 - dif / 100)
                }
            }
            this.artifactRating = this.getArtifactRating(this.artifactScore)

            this.showArtifactScore = true

            console.log("calculateScore", this.appendProp)
        },

        $template: "#artifact-template"
    });

    createApp({
        store,
        PropWeight,
        Artifact
    }).mount()
</script>
</body>
</html>
